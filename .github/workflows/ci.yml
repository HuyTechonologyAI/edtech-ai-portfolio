name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node runtime environment
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint protected/changed scope
        run: npm run lint:quality-gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-ci-service-role-key

  legacy-lint-audit:
    name: Legacy Lint Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run legacy lint audit
        run: npm run lint
